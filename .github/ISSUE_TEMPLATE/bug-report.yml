name: Bug report
description: Report a reproducible product or engineering defect.
title: "bug: "
labels:
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Describe the observed defect and its user impact.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Identify app version, device or runtime, and relevant configuration.
    validations:
      required: true
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to reproduce
      description: List the smallest repeatable sequence that exposes the defect.
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: Describe what should happen instead.
    validations:
      required: true
  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual behavior
      description: Describe what happened, including errors or logs when available.
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: List observable criteria that prove the defect is resolved.
    validations:
      required: true
